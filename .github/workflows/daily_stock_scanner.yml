name: Daily Taiwan Stock Scanner

on:
  schedule:
    # 主排程：週一至週五 09:30 UTC = 台北 17:30。
    # 單一排程避免同日重複掃描與下游 workflow_run 連鎖觸發。
    # 必須晚於籌碼更新（16:35 / 備援 16:55）。
    - cron: '30 9 * * 1-5'
  workflow_dispatch:

jobs:
  run-main-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests gspread google-auth

      - name: Test V-reversal rules
        run: python -m unittest discover -v

      - name: Run main stock scanner
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          python main_stock_scanner.py
